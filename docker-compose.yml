services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: adara
      POSTGRES_PASSWORD: adara
      POSTGRES_DB: adara_dev
    ports:
      - "5432:5432"
    volumes:
      - adara_pg:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    build: ./apps/api
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      DATABASE_URL: postgres://adara:adara@postgres:5432/adara_dev
    depends_on:
      - postgres
      - redis

volumes:
  adara_pg:
