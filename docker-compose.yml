services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: adara
      POSTGRES_PASSWORD: adara
      POSTGRES_DB: adara_dev
    ports:
      - "5432:5432"
    volumes:
      - adara_pg:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    build: ./services/door
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      ADARA_DOOR_DEV: "1"
      ADARA_API_KEYS: "dev"
      ADARA_SPEECH_MMS_MODEL: ${ADARA_SPEECH_MMS_MODEL:-facebook/mms-1b-all}
      ADARA_SPEECH_MMS_DEVICE: ${ADARA_SPEECH_MMS_DEVICE:-cpu}
    # Intelligence + optional MMS weights are expected on the image / volume in real deploys.
    # Local `make api` is the supported Path for Day-1 development.

volumes:
  adara_pg:
