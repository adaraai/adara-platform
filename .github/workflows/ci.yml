name: ci

on:
  push:
    branches: [main]
  pull_request:

# Least privilege by default: workflow-level `{}` drops every scope, and each job below opts back
# in to exactly what it needs. Same convention as adara-intelligence and adara-sdk's own CI.
permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  voice-agent:
    # voice-agent, adara-sdk and adara-intelligence live in three sibling repositories (see
    # tests/conftest.py's own comment on this). Its tests run against the real intelligence
    # layer via LocalTransport, not just fakes, so both siblings are checked out here — the same
    # pattern adara-sdk's own CI already uses to reach this repo for its contract tests.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: services/voice-agent
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      # A sibling repository may not be readable from this job's token. continue-on-error keeps
      # that from failing the whole build the way adara-sdk's CI already tolerates a missing
      # adara-platform checkout for its own contract tests.
      - name: Check out adara-intelligence
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        continue-on-error: true
        with:
          repository: adaraai/adara-intelligence
          path: adara-intelligence
          persist-credentials: false

      - name: Check out adara-sdk
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        continue-on-error: true
        with:
          repository: adaraai/adara-sdk
          path: adara-sdk
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e "$GITHUB_WORKSPACE/adara-intelligence"
          pip install -e "$GITHUB_WORKSPACE/adara-sdk/python[local]"
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check src tests

      - name: Test
        run: pytest -q

  providers:
    # A small, dependency-free package that predates voice-agent; kept its own lightweight job
    # rather than folding into voice-agent's, since it needs neither sibling repo installed.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Test packages/providers
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          pytest -q packages/providers
