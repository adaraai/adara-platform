[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "adara-voice-agent"
version = "0.1.0"
description = "Backend for the ADARA mobile voice agent: sessions, turns, and orchestration over adara-sdk."
requires-python = ">=3.11"
license = "Apache-2.0"

# The SDK, and nothing else. The HTTP surface is stdlib http.server, matching apps/api which does
# the same in Node — a development service that installs anywhere and conflicts with nothing.
dependencies = ["adara-sdk"]

[project.optional-dependencies]
# Runs adara-intelligence inside this process, which is what makes the service work before any
# ADARA deployment exists. Not needed when ADARA_MODE=api.
local = ["adara-sdk[local]"]
dev = ["pytest>=8", "ruff>=0.16,<0.17"]

[project.scripts]
adara-voice-agent = "voice_agent.server:main"

[tool.setuptools]
package-dir = { "" = "src" }
packages = ["voice_agent"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "BLE", "C4", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# no:cacheprovider: skip writing .pytest_cache/ entirely — nothing here uses --lf/--ff.
addopts = "-p no:cacheprovider"
