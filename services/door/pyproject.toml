[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "adara-door"
version = "0.1.0"
description = "ADARA public Door — hosted Hear / Understand / Speak over OpenAPI /v1."
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.32,<1",
    "python-multipart>=0.0.9,<1",
    "adara-intelligence",
]

[project.optional-dependencies]
mms = ["adara-intelligence[mms]"]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.16,<0.17"]

[project.scripts]
adara-door = "door.__main__:main"

[tool.setuptools]
package-dir = { "" = "src" }
packages = ["door"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "BLE", "C4", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
